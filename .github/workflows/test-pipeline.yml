
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches: [ "develop", "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout head branch'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: make build

    - name: 'Compute after coverage'
      shell: bash
      run: |
        go test -cover -v ./... |\
        grep -v "\[no test files\]" |\
        grep -v "\[no statements\]" |\
        grep "^\(ok\|FAIL\).*" |\
        awk '{printf "%s %d\n", $2, $5}' > after.cover
        cat after.cover
    
    - name: 'Checkout base branch'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      with:
        path: base
        ref: ${{ github.event.pull_request.base.sha }}

    - name: 'Compute before coverage'
      working-directory: base
      shell: bash
      run: |
        go test -cover ./... |\
        grep -v "\[no test files\]" |\
        grep -v "\[no statements\]" |\
        grep "^\(ok\|FAIL\).*" |\
        awk '{printf "%s %d\n", $2, $5}' > before.cover
        cat before.cover

    - name: 'Copy Before'
      shell: bash
      run: cp base/before.cover before.cover

    - name: 'Generate diff'
      shell: bash
      run: |
        #!/bin/bash
        set -oe pipefail

        declare -A coverage_before
        while read -r pkg x; do
          coverage_before["$pkg"]="$x"
        done < "before.cover"

        declare -A coverage_after
        while read -r pkg x; do
          coverage_after["$pkg"]="$x"
        done < "after.cover"

        declare -A all_pkgs
        for pkg in "${!coverage_before[@]}"; do
          all_pkgs["$pkg"]=1
        done
        for pkg in "${!coverage_after[@]}"; do
          all_pkgs["$pkg"]=1
        done

        > diff_raw
        has_regression=0

        for pkg in "${!all_pkgs[@]}"; do
          before="${coverage_before[$pkg]}"
          after="${coverage_after[$pkg]}"

          if [[ -z "$before" ]]; then
            echo "| $pkg | - | ${after}% | New Package |" >> diff_raw
            continue
          fi

          if awk -v b="$before" -v a="$after" 'BEGIN { exit (b > a ? 0 : 1) }'; then
            echo "| $pkg | ${before}% | ${after}% | Regressed |" >> diff_raw
            has_regression=1
          else
            echo "| $pkg | ${before}% | ${after}% | OK |" >> diff_raw
          fi
        done

        echo "### Test coverage changes:" > diff
        echo "| Package | Before | After | Status |" >> diff
        echo "|---|---|---|---|" >> diff
        cat diff_raw | sort >> diff

        cat diff

        # Print table into the summary of github action
        cat diff >> $GITHUB_STEP_SUMMARY

        # If there had been regression, test fails
        if [[ "$has_regression" -eq 1 ]]; then
          echo -e "\n Error: Coverage regression or dropped tests detected. Please check the table above."
          exit 1
        fi
